<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trick</title>
    <meta name="description" content="Truco argentino en 3D, con señas de verdad." />
    <style>
      :root {
        --bg: #1b1410;
        --panel: #2a201a;
        --line: #4a3a2e;
        --text: #f3e9dc;
        --muted: #b9a893;
        --accent: #e8b04a;
        --us: #6db3e8;
        --them: #e87a6d;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, 'Segoe UI', sans-serif; }
      button, input, select { font: inherit; color: inherit; }
      button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: .5; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #241808; font-weight: 600; }
      input, select { background: #17110d; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
      label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
      h1 { font-size: 44px; margin: 0; letter-spacing: -.02em; }
      h2 { font-size: 18px; margin: 0 0 12px; }
      .page { max-width: 880px; margin: 0 auto; padding: 32px 16px; }
      .sub { color: var(--muted); margin: 4px 0 24px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
      .row { display: flex; gap: 8px; }
      .stack > * + * { margin-top: 12px; }
      .error { color: var(--them); min-height: 22px; margin: 12px 0 0; }
      .muted { color: var(--muted); font-size: 14px; }
      .code { font-size: 40px; letter-spacing: .15em; font-weight: 700; color: var(--accent); }
      .seat { display: flex; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
      .team0 { border-left: 4px solid var(--us); }
      .team1 { border-left: 4px solid var(--them); }
      .warn { background: #4a2d1a; border: 1px solid var(--accent); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
